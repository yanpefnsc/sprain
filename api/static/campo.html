<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SPRAIN - Terminal de Campo (Simulador)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; background: #0b0f19; color: #f8fafc; }
    header { padding: 8px 14px; background: #111827; border-bottom: 1px solid #1f2937; display: flex; align-items: center; justify-content: space-between; }
    .titulo { font-size: 0.9rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; }
    
    .barra-simulacao { background: #1e293b; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; overflow-x: auto; }
    .label-sim { font-size: 0.7rem; color: #94a3b8; font-weight: 700; white-space: nowrap; }
    .btn-pos { background: #334155; color: #f1f5f9; border: 1px solid #475569; padding: 4px 8px; border-radius: 4px; font-size: 0.72rem; cursor: pointer; white-space: nowrap; font-weight: 600; }
    .btn-pos:hover { background: #0284c7; border-color: #38bdf8; }

    #banner-local { background: #0f172a; padding: 10px 14px; border-bottom: 2px solid #38bdf8; display: flex; flex-direction: column; gap: 2px; }
    .label-local { font-size: 0.68rem; text-transform: uppercase; font-weight: 700; color: #94a3b8; }
    .nome-via-atual { font-size: 1.05rem; font-weight: 800; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #map-wrapper { flex: 1; position: relative; width: 100%; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    .painel-operacional { padding: 12px 14px; background: #111827; border-top: 1px solid #1f2937; display: flex; flex-direction: column; gap: 8px; }
    .grid-botoes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .btn-acao { border: none; padding: 12px 6px; border-radius: 6px; font-weight: 800; font-size: 0.8rem; cursor: pointer; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform 0.1s; }
    .btn-acao:active { transform: scale(0.97); }
    .btn-acao span { font-size: 0.65rem; font-weight: 400; opacity: 0.85; }

    .btn-verde { background: #15803d; }
    .btn-amarelo { background: #ca8a04; }
    .btn-laranja { background: #ea580c; }
    .btn-vermelho { background: #dc2626; }

    .input-obs { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 8px 10px; color: #f8fafc; font-size: 0.8rem; }
    .input-obs:focus { outline: none; border-color: #38bdf8; }
    .feedback-msg { text-align: center; font-size: 0.78rem; min-height: 18px; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="titulo">SPRAIN • Operação de Campo</div>
    <div style="font-size:0.7rem; color:#38bdf8; font-weight:700;">MODO TESTE / SIMULAÇÃO</div>
  </header>

  <div class="barra-simulacao">
    <span class="label-sim">Simular Viatura em:</span>
    <button class="btn-pos" onclick="teletransportar(-23.5428, -46.4715)">Jacu-Pêssego</button>
    <button class="btn-pos" onclick="teletransportar(-23.5385, -46.4552)">Estação Itaquera</button>
    <button class="btn-pos" onclick="teletransportar(-23.5471, -46.4608)">Sabbado D'Angelo</button>
    <button class="btn-pos" onclick="teletransportar(-23.5512, -46.4820)">Pires do Rio</button>
  </div>

  <div id="banner-local">
    <div class="label-local">Logradouro Detectado via PostGIS</div>
    <div class="nome-via-atual" id="nome-via">A carregar logradouro...</div>
  </div>

  <div id="map-wrapper">
    <div id="map"></div>
  </div>

  <div class="painel-operacional">
    <div class="grid-botoes">
      <button type="button" class="btn-acao btn-verde" onclick="enviarRelato('VERDE')">
        TRANSITÁVEL
        <span>Livre / sem alagamento</span>
      </button>
      <button type="button" class="btn-acao btn-amarelo" onclick="enviarRelato('AMARELO')">
        ATENÇÃO
        <span>Lâmina d'água</span>
      </button>
      <button type="button" class="btn-acao btn-laranja" onclick="enviarRelato('LARANJA')">
        CRÍTICO LEVE
        <span>Veículos retidos</span>
      </button>
      <button type="button" class="btn-acao btn-vermelho" onclick="enviarRelato('VERMELHO')">
        INTRANSITÁVEL
        <span>Pistas submersas</span>
      </button>
    </div>

    <input type="text" id="campo-obs" class="input-obs" placeholder="Observação complementar (opcional)..." />
    <div class="feedback-msg" id="feedback"></div>
  </div>

  <script>
    let lat = -23.5428;
    let lon = -46.4715;
    let timerBusca = null;

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: 'OpenStreetMap'
          }
        },
        layers: [{ type: 'raster', id: 'osm-base', source: 'osm' }]
      },
      center: [lon, lat],
      zoom: 16
    });

    const marker = new maplibregl.Marker({ color: '#38bdf8', draggable: true })
      .setLngLat([lon, lat])
      .addTo(map);

    async function identificarVia(latAtual, lonAtual) {
      try {
        const res = await fetch(`/api/v1/ocorrencias/via-proxima?lat=${latAtual}&lon=${lonAtual}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById('nome-via').innerText = data.localizado ? data.nome_via : 'Fora da malha de Itaquera';
      } catch (e) {
        document.getElementById('nome-via').innerText = 'Avenida Jacu-Pêssego';
      }
    }

    function atualizarCoordenadas(novaLon, novaLat) {
      lon = Number(novaLon.toFixed(6));
      lat = Number(novaLat.toFixed(6));
      marker.setLngLat([lon, lat]);
      clearTimeout(timerBusca);
      timerBusca = setTimeout(() => identificarVia(lat, lon), 200);
    }

    function teletransportar(novaLat, novaLon) {
      map.flyTo({ center: [novaLon, novaLat], zoom: 16 });
      atualizarCoordenadas(novaLon, novaLat);
    }

    marker.on('dragend', () => {
      const p = marker.getLngLat();
      atualizarCoordenadas(p.lng, p.lat);
    });

    map.on('click', (e) => {
      atualizarCoordenadas(e.lngLat.lng, e.lngLat.lat);
    });

    async function enviarRelato(nivel) {
      const fb = document.getElementById('feedback');
      const obs = document.getElementById('campo-obs').value.trim();
      fb.style.color = '#38bdf8';
      fb.innerText = 'Enviando à Sala de Situação...';

      try {
        const r = await fetch('/api/v1/ocorrencias/alerta-rapido', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            latitude: lat,
            longitude: lon,
            nivel: nivel,
            corporacao: 'VIATURA_TESTE',
            observacao: obs || null
          })
        });

        if (!r.ok) throw new Error();
        const info = await r.json();
        fb.style.color = '#4ade80';
        fb.innerText = `Registrado: ${info.via} alterada para ${info.novo_status}`;
        document.getElementById('campo-obs').value = '';
      } catch (err) {
        fb.style.color = '#ef4444';
        fb.innerText = 'Falha ao registrar ocorrência.';
      }
    }

    map.on('load', () => identificarVia(lat, lon));
  </script>
</body>
</html>
