services:
  sprain_api:
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-}

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      SPRAIN_DOMAIN: ${SPRAIN_DOMAIN:?defina SPRAIN_DOMAIN no .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - sprain_caddy_data:/data
      - sprain_caddy_config:/config
    depends_on:
      sprain_api:
        condition: service_healthy
    networks:
      - sprain_prod_net

  sprain_chuva:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SPRAIN_BUILD_COMMIT: ${SPRAIN_BUILD_COMMIT:?defina o SHA completo do commit aprovado}
    profiles: ["chuva"]
    restart: unless-stopped
    command: ["python", "-B", "/app/scripts/worker_chuva.py"]
    environment:
      ENVIRONMENT: production
      DB_HOST: sprain_db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?defina DB_USER no .env.prod}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env.prod}
      DB_NAME: ${DB_NAME:?defina DB_NAME no .env.prod}
      CHUVA_INTERVALO_SEGUNDOS: ${CHUVA_INTERVALO_SEGUNDOS:-600}
      WEBHOOK_ALERTA_DADOS: ${WEBHOOK_ALERTA_DADOS:-}
    depends_on:
      sprain_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-B", "/app/scripts/worker_chuva_status.py"]
      interval: 120s
      timeout: 5s
      start_period: 3m
      retries: 2
    networks:
      - sprain_prod_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  sprain_caddy_data:
  sprain_caddy_config:
