services:
  sprain_db:
    image: pgrouting/pgrouting@sha256:5e6767abbd1fd9ead84c9988aa31bac71ca292ef8a1fc2e4a5ee2b613ac6a7bb
    container_name: sprain_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-enchentes}
      POSTGRES_USER: ${DB_USER:-enchentes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-enchentes}
    volumes:
      - sprain_db_prod_data:/var/lib/postgresql/data
    networks:
      - sprain_prod_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-enchentes} -d ${DB_NAME:-enchentes}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sprain_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sprain_api_prod
    restart: always
    environment:
      DB_HOST: sprain_db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-enchentes}
      DB_PASSWORD: ${DB_PASSWORD:-enchentes}
      DB_NAME: ${DB_NAME:-enchentes}
      API_KEYS: ${API_KEYS:-key_admin_demo,key_operator_demo,key_viewer_demo}
      TENANT_API_KEYS: ${TENANT_API_KEYS:-key_admin_demo:ADMIN:demo_corp;key_operator_demo:OPERATOR:demo_corp;key_viewer_demo:VIEWER:demo_corp;key_admin_express:ADMIN:log_express}
    ports:
      - "8000:8000"
    depends_on:
      sprain_db:
        condition: service_healthy
    networks:
      - sprain_prod_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  sprain_prod_net:
    driver: bridge

volumes:
  sprain_db_prod_data:
    driver: local