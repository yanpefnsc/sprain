version: '3.8'

services:
  sprain_db:
    image: postgis/postgis:15-3.3
    container_name: sprain_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sprain_password}
      POSTGRES_DB: ${POSTGRES_DB:-enchentes}
    volumes:
      - sprain_db_prod_data:/var/lib/postgresql/data
    networks:
      - sprain_prod_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-enchentes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sprain_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sprain_api_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-sprain_password}@sprain_db:5432/${POSTGRES_DB:-enchentes}
      ENVIRONMENT: production
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-5}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
    ports:
      - "8000:8000"
    depends_on:
      sprain_db:
        condition: service_healthy
    networks:
      - sprain_prod_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  sprain_prod_net:
    driver: bridge

volumes:
  sprain_db_prod_data:
    driver: local
