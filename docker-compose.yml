services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sprain_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sprain}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sprain}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sprain_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sprain}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api

volumes:
  pgdata:
