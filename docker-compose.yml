services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sprain_db
    restart: always
    environment:
      POSTGRES_DB: enchentes
      POSTGRES_USER: enchentes
      POSTGRES_PASSWORD: enchentes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enchentes -d enchentes"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: sprain_api
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: enchentes
      DB_PASSWORD: enchentes
      DB_NAME: enchentes
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: