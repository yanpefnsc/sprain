services:
  db:
    image: pgrouting/pgrouting@sha256:5e6767abbd1fd9ead84c9988aa31bac71ca292ef8a1fc2e4a5ee2b613ac6a7bb
    container_name: sprain_db
    restart: always
    environment:
      POSTGRES_DB: enchentes
      POSTGRES_USER: enchentes
      POSTGRES_PASSWORD: enchentes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enchentes -d enchentes"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: sprain_api
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: enchentes
      DB_PASSWORD: enchentes
      DB_NAME: enchentes
      API_KEYS: ${API_KEYS}
      TENANT_API_KEYS: ${TENANT_API_KEYS:-}
      WEBHOOK_SECRET_KEY: Wks6HRPLe-Ypf513abN4jB2uL3ZAj5hcTIs0r7PmWMI=
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/readiness"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  dados-publicos:
    build: .
    profiles: ["dados"]
    restart: unless-stopped
    command: ["python", "-B", "/app/scripts/worker_dados_publicos.py"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-enchentes}
      DB_PASSWORD: ${DB_PASSWORD:-enchentes}
      DB_NAME: ${DB_NAME:-enchentes}
      SPRAIN_INFRA_TENANT: ${SPRAIN_INFRA_TENANT:-}
      DADOS_PUBLICOS_INTERVALO_HORAS: ${DADOS_PUBLICOS_INTERVALO_HORAS:-24}
      WEBHOOK_ALERTA_DADOS: ${WEBHOOK_ALERTA_DADOS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-B", "/app/scripts/worker_status.py"]
      interval: 60s
      timeout: 5s
      start_period: 2m
      retries: 2

volumes:
  pgdata:
