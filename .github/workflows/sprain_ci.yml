name: SPRain CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Start Containers
        run: |
          docker compose up -d --build
          sleep 15

      - name: Run Full Test Suite Inside Container
        run: |
          docker exec sprain_api pytest tests/ -v

      - name: Shutdown Containers
        if: always()
        run: |
          docker compose down
