name: SPRain CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    env:
      SPRAIN_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Start Containers
        run: |
          docker compose build api
          echo "ENVIRONMENT=testing" > .env
          echo "API_KEYS=key_admin_demo,key_operator_demo,key_viewer_demo,key_admin_express" >> .env
          echo "TENANT_API_KEYS=key_admin_demo:ADMIN:demo_corp;key_operator_demo:OPERATOR:demo_corp;key_viewer_demo:VIEWER:demo_corp;key_admin_express:ADMIN:log_express" >> .env
          echo "DB_USER=enchentes" >> .env
          echo "DB_PASSWORD=enchentes" >> .env
          echo "DB_NAME=enchentes" >> .env
          echo "GITHUB_ACTIONS=true" >> .env
          docker compose up -d db

      - name: Wait for Postgres and Bootstrap CI Database
        run: |
          docker exec sprain_db sh -c 'until pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done'
          for f in db/ci/*.sql; do
            docker cp "$f" sprain_db:/tmp/ci.sql
            docker exec sprain_db psql -v ON_ERROR_STOP=1 -U enchentes -d enchentes -f /tmp/ci.sql
          done

      - name: Wait for API Readiness Probe
        run: |
          docker compose up -d api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/readiness >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/readiness

      - name: Verify running image revision
        run: |
          running_revision=$(curl -fsS -H 'X-API-Key: key_admin_demo' http://127.0.0.1:8000/api/v1/operacional/versao | python3 -c 'import json,sys; print(json.load(sys.stdin)["revisao"])')
          test "$running_revision" = "$SPRAIN_BUILD_COMMIT"

      - name: Run Full Test Suite Inside Container
        run: |
          docker exec sprain_api python -m pip install --user pytest pytest-asyncio httpx
          docker exec -w /app/api sprain_api python -m pytest tests/ -v

      - name: Verify Backup and Restore in a New CI Database
        run: |
          set -euo pipefail
          backup_dir="$(mktemp -d "${RUNNER_TEMP}/sprain-backup-XXXXXX")"
          python3 scripts/postgres_backup.py backup \
            --container sprain_db --database enchentes --user enchentes --output-dir "$backup_dir"
          python3 scripts/postgres_backup.py verify-latest \
            --database enchentes --output-dir "$backup_dir" --max-age-hours 1
          backup_file="$(find "$backup_dir" -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "$backup_file"
          python3 scripts/postgres_backup.py restore \
            --container sprain_db --user enchentes --new-database sprain_restore_ci --backup "$backup_file"
          source_count="$(docker exec sprain_db psql -v ON_ERROR_STOP=1 -U enchentes -d enchentes -tA -c 'SELECT count(*) FROM trechos_osm')"
          restored_count="$(docker exec sprain_db psql -v ON_ERROR_STOP=1 -U enchentes -d sprain_restore_ci -tA -c 'SELECT count(*) FROM trechos_osm')"
          test "$source_count" = "$restored_count"
          docker exec sprain_db psql -v ON_ERROR_STOP=1 -U enchentes -d sprain_restore_ci -tA -c 'SELECT PostGIS_Version()' | grep -q .

      - name: Test Panel Session and Request Isolation
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Prepare Isolated Browser Tests
        run: |
          npx playwright install --with-deps chromium
          docker compose -f compose.e2e.yml up -d --build --wait
          docker compose -f compose.e2e.yml exec -T api python /app/scripts/seed_testes_painel.py

      - name: Measure Basic Route and Risk Load
        env:
          SPRAIN_API_KEY: key_viewer_demo
        run: |
          python3 scripts/medir_carga_api.py --saida test-results/carga-api.json

      - name: Preserve Load Measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carga-api
          path: test-results/carga-api.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Test Main Panel Flows in Chromium
        run: npm run test:e2e

      - name: Preserve Browser Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Output API Logs on Failure
        if: failure()
        run: |
          docker logs sprain_api --tail 100

      - name: Shutdown Containers
        if: always()
        run: |
          docker compose -f compose.e2e.yml down
          docker compose down

  production-compose-smoke:
    runs-on: ubuntu-latest
    env:
      SPRAIN_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create disposable production configuration
        run: |
          set -euo pipefail
          umask 077
          db_password="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          api_key="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          webhook_key="$(python3 -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
          {
            printf 'SPRAIN_BUILD_COMMIT=%s\n' "$SPRAIN_BUILD_COMMIT"
            printf 'SPRAIN_DOMAIN=ci.invalid\nACME_EMAIL=ci@example.invalid\n'
            printf 'DB_NAME=sprain_ci_prod\nDB_USER=sprain_ci_prod\nDB_PASSWORD=%s\n' "$db_password"
            printf 'API_KEYS=%s\nTENANT_API_KEYS=%s:ADMIN:ci_company\n' "$api_key" "$api_key"
            printf 'WEBHOOK_SECRET_KEY=%s\n' "$webhook_key"
          } > .env.prod
          docker compose --env-file .env.prod -p sprain-prod-smoke \
            -f docker-compose.prod.yml -f compose.vps.yml config --quiet

      - name: Start isolated PostGIS and load CI fixture
        run: |
          set -euo pipefail
          docker compose --env-file .env.prod -p sprain-prod-smoke \
            -f docker-compose.prod.yml -f compose.vps.yml up -d --wait sprain_db
          empty="$(docker exec sprain_db_prod psql -v ON_ERROR_STOP=1 \
            -U sprain_ci_prod -d sprain_ci_prod -tAc \
            "SELECT to_regclass('public.trechos_osm') IS NULL")"
          test "$empty" = t
          for fixture in db/ci/*.sql; do
            docker cp "$fixture" sprain_db_prod:/tmp/ci-fixture.sql
            docker exec sprain_db_prod psql -v ON_ERROR_STOP=1 \
              -U sprain_ci_prod -d sprain_ci_prod -f /tmp/ci-fixture.sql > /dev/null
          done
          docker exec sprain_db_prod psql -v ON_ERROR_STOP=1 \
            -U sprain_ci_prod -d sprain_ci_prod -tAc \
            'SELECT PostGIS_Version(), pgr_version(), count(*) FROM trechos_osm' \
            | python3 -c 'import sys; fields=sys.stdin.read().strip().split("|"); assert len(fields)==3 and int(fields[2])>0'

      - name: Start production API and verify readiness
        run: |
          set -euo pipefail
          docker compose --env-file .env.prod -p sprain-prod-smoke \
            -f docker-compose.prod.yml -f compose.vps.yml \
            up -d --build --wait sprain_api
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          base = "http://127.0.0.1:8000"
          with urllib.request.urlopen(base + "/api/v1/health/readiness", timeout=10) as response:
              readiness = json.load(response)
          assert readiness["status"] == "READY"
          assert readiness["postgis"] == "OPERACIONAL"
          assert readiness["total_trechos_osm"] > 0
          with open(".env.prod", encoding="utf-8") as config:
              key = next(line.split("=", 1)[1].strip() for line in config if line.startswith("API_KEYS="))
          request = urllib.request.Request(base + "/api/v1/operacional/versao", headers={"X-API-Key": key})
          with urllib.request.urlopen(request, timeout=10) as response:
              version = json.load(response)
          assert version["revisao"] == os.environ["SPRAIN_BUILD_COMMIT"]
          print("Production Compose: API READY, PostGIS active, image revision verified.")
          PY

      - name: Show production container logs on failure
        if: failure()
        run: |
          docker logs sprain_db_prod --tail 80 || true
          docker logs sprain_api_prod --tail 80 || true

      - name: Stop disposable production containers
        if: always()
        run: |
          if [ -f .env.prod ]; then
            docker compose --env-file .env.prod -p sprain-prod-smoke \
              -f docker-compose.prod.yml -f compose.vps.yml down
          fi
