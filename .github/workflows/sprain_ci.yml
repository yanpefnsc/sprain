name: SPRain CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Start Containers
        run: |
          docker compose up -d --build
          sleep 10

      - name: Wait for Postgres & Bootstrap Minimal Schema
        run: |
          docker exec sprain_db sh -c 'until pg_isready; do sleep 2; done'
          docker exec -i sprain_db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' << 'EOF'
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS pgrouting;
            CREATE TABLE IF NOT EXISTS trechos_osm (
              id SERIAL PRIMARY KEY,
              source INT DEFAULT 1,
              target INT DEFAULT 2,
              cost DOUBLE PRECISION DEFAULT 1.0,
              reverse_cost DOUBLE PRECISION DEFAULT 1.0,
              nome_via TEXT DEFAULT 'Avenida Radial Leste',
              geom geometry(Geometry, 4326)
            );
            INSERT INTO trechos_osm (source, target, cost, reverse_cost, nome_via)
            VALUES (1, 2, 1.0, 1.0, 'Avenida Radial Leste')
            ON CONFLICT DO NOTHING;
          EOF

      - name: Run Full Test Suite Inside Container
        run: |
          docker exec sprain_api pip install pytest pytest-asyncio httpx
          docker exec -w /app/api sprain_api python -m pytest tests/ -v

      - name: Shutdown Containers
        if: always()
        run: |
          docker compose down
